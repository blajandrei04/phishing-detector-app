version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishing_detector_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the database file so that historical data and feedback persist across container restarts
      - ./backend/phishing_detector.db:/app/phishing_detector.db
    environment:
      # Explicitly allow CORS from the frontend container (port 4000) and localhost
      - CORS_ORIGINS=["http://localhost:4000", "http://localhost:4200", "http://127.0.0.1:4000", "http://127.0.0.1:4200"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: phishing_detector_frontend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    depends_on:
      - backend
    restart: unless-stopped
