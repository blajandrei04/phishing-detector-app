<div class="row justify-content-center mt-5">
  <div class="col-md-8 col-lg-6 mt-4">
    <div class="card border-0">
      <div class="card-body p-2">
        <h2 class="card-title text-center mb-3">Phishing URL Analyzer</h2>
        <p class="text-center text-muted mb-5">
          Enter a website URL below to test if it's safe or a phishing attempt.
        </p>

        <div class="mb-4">
          <label for="urlInput" class="form-label fw-bold text-dark mb-3" style="font-size: 0.9rem;">Website URL</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted px-3"><i class="bi bi-globe"></i></span>
            <input
              id="urlInput"
              type="url"
              class="form-control border-start-0 ps-0"
              [(ngModel)]="url"
              placeholder="https://example.com"
              (keyup.enter)="submit()"
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="d-grid gap-2">
          <button
            class="btn btn-primary btn-lg d-flex justify-content-center align-items-center"
            (click)="submit()"
            [disabled]="loading || !url.trim()"
          >
            @if (loading) {
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
                aria-hidden="true"
              ></span>
              Analyzing...
            } @else {
              Analyze URL
            }
          </button>
        </div>

        @if (error) {
          <div class="error-alert mt-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <div>{{ error }}</div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
